name: Build Linux Deploy

on:
  push:
    branches: [ "master" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-29" "build-tools;29.0.2"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        if: ${{ secrets.SIGNING_KEY != '' }}
        uses: kevin-david/zipalign-sign-android-release@v2
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          zipAlign: true

      - name: Upload signed APK
        if: ${{ secrets.SIGNING_KEY != '' && steps.sign_app.outputs.signedReleaseFile != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: linuxdeploy-signed-apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Upload unsigned APK
        if: ${{ secrets.SIGNING_KEY == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: linuxdeploy-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
